name: JarvisDashboard

options:
  bundleIdPrefix: com.skeemadigital
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.2.15"
    CURRENT_PROJECT_VERSION: "16"

targets:
  JarvisDashboard:
    type: application
    platform: macOS
    sources:
      - path: Sources/JarvisDashboard
      - path: Supporting/Assets.xcassets
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: JARVIS Dashboard
        CFBundleName: JARVIS Dashboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: Copyright © 2026 Skeema Digital. All rights reserved.
        NSLocationWhenInUseUsageDescription: JARVIS uses your Mac location only when you choose Use Mac location to show a local weather forecast.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: true
    settings:
      base:
        PRODUCT_NAME: JarvisDashboard
        PRODUCT_BUNDLE_IDENTIFIER: com.skeemadigital.jarvisdashboard
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - JarvisDashboardTests

  JarvisDashboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/JarvisDashboardTests
    dependencies:
      - target: JarvisDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skeemadigital.jarvisdashboard.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  JarvisDashboard:
    build:
      targets:
        JarvisDashboard: all
        JarvisDashboardTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - JarvisDashboardTests
    run:
      config: Debug
    archive:
      config: Release
