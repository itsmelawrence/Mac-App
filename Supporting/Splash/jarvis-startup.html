<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. Startup</title>
<style>
  :root { --cyan:#5ee7ff; --deep:#1aa7d6; --ice:#e6fbff; --bg:#02060c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"SF Pro Display",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ice);
    background:radial-gradient(ellipse at 50% 45%, #0f2740 0%, #06121f 55%, #02060c 100%);
  }
  #stage { display:flex; flex-direction:column; align-items:center; transition:opacity .8s ease; }
  body.done #stage { opacity:0; }

  /* ---------- logo ---------- */
  svg { width:min(72vmin,640px); height:auto; overflow:visible; }
  #logo { transform-box:fill-box; transform-origin:center; animation:settle 3.4s cubic-bezier(.16,.8,.2,1) both; }
  @keyframes settle { from { transform:scale(.88); } to { transform:scale(1); } }

  .glow { filter:url(#glow); }
  .ring { transform-box:fill-box; transform-origin:center; opacity:0; fill:none; stroke:url(#stroke); }
  .idle { transform-box:fill-box; transform-origin:center; animation:idle var(--t) linear infinite; animation-direction:var(--dir,normal); }
  @keyframes idle { to { transform:rotate(360deg); } }
  @keyframes spinIn {
    from { opacity:0; transform:rotate(var(--from)) scale(.55); }
    60%  { opacity:1; }
    to   { opacity:1; transform:rotate(var(--to)) scale(1); }
  }
  .spin { animation:spinIn 1.5s cubic-bezier(.2,.8,.2,1) var(--d) forwards; }

  #core { fill:url(#coreGrad); opacity:0; transform-box:fill-box; transform-origin:center;
          animation:coreOn 1.2s ease-out .1s forwards, breathe 4s ease-in-out 2s infinite; }
  @keyframes coreOn { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
  @keyframes breathe { 0%,100% { opacity:1; } 50% { opacity:.6; } }

  #inner { stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.3s ease-in-out .8s forwards; }
  @keyframes draw { from { stroke-dashoffset:1; opacity:0; } 5% { opacity:1; } to { stroke-dashoffset:0; opacity:.85; } }


  #flash { fill:none; stroke:var(--cyan); stroke-width:4; opacity:0; transform-box:fill-box; transform-origin:center;
           animation:flash 1.4s ease-out 2.5s forwards; }
  @keyframes flash { from { opacity:.9; transform:scale(.7); } to { opacity:0; transform:scale(3.6); } }

  @media (prefers-reduced-motion:reduce) { .idle, #core { animation:none; } }
</style>
</head>
<body>
<div id="stage">
  <svg viewBox="140 140 744 744" aria-label="J.A.R.V.I.S. logo">
    <defs>
      <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#5ee7ff" stop-opacity=".38"/>
        <stop offset=".7" stop-color="#1aa7d6" stop-opacity=".12"/>
        <stop offset="1" stop-color="#1aa7d6" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9af3ff"/><stop offset="1" stop-color="#1aa7d6"/>
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g id="logo">
      <circle id="core" cx="512" cy="512" r="335"/>

      <g class="glow">
        <!-- fine tick ring -->
        <g class="idle" style="--t:90s;--dir:reverse">
          <circle class="ring spin" cx="512" cy="512" r="335" stroke-width="14" stroke-dasharray="2 17" stroke-linecap="butt"
                  style="--from:-90deg;--to:0deg;--d:.5s"/>
        </g>
        <!-- outer segmented ring -->
        <g class="idle" style="--t:60s">
          <circle class="ring spin" cx="512" cy="512" r="295" stroke-linecap="round" stroke-width="7" stroke-dasharray="230 48 120 48 230 48 120 48"
                  style="--from:-200deg;--to:-20deg;--d:.7s"/>
        </g>
        <!-- thick arc ring -->
        <g class="idle" style="--t:36s;--dir:reverse">
          <circle class="ring spin" cx="512" cy="512" r="248" stroke-width="20" stroke-linecap="butt"
                  stroke-dasharray="330 90 190 90 330 90 190 90" style="--from:180deg;--to:35deg;--d:.9s"/>
        </g>
        <!-- inner thin ring -->
        <circle id="inner" cx="512" cy="512" r="196" stroke-width="4" pathLength="1"
                fill="none" stroke="url(#stroke)"/>
        <!-- core ring -->
        <g class="idle" style="--t:14s">
          <circle class="ring spin" cx="512" cy="512" r="148" stroke-linecap="round" stroke-width="9" stroke-dasharray="120 24"
                  style="--from:-240deg;--to:10deg;--d:1.1s"/>
        </g>
      </g>

      <circle id="flash" cx="512" cy="512" r="150"/>

    </g>
  </svg>

</div>

<script>
  // Startup animation runs ~3.8s. Hook into it from your app:
  //   window.addEventListener('splash:done', () => { /* show main window */ });
  // Add ?autoclose to the URL to fade out automatically when finished.
  var DURATION = 3800;
  setTimeout(function () {
    window.dispatchEvent(new CustomEvent('splash:done'));
    // Also notify a parent window when embedded in an <iframe> overlay
    if (window.parent !== window) window.parent.postMessage({ type: 'jarvis-splash-done' }, '*');
    if (location.search.indexOf('autoclose') > -1) document.body.classList.add('done');
  }, DURATION);
  // Click to replay when previewing in a browser (disabled inside Tauri)
  if (!window.__TAURI__) document.addEventListener('click', function () { location.reload(); });
</script>
</body>
</html>
